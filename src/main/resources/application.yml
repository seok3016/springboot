spring:
  datasource: # 메모리에 임시 DB를 만들어 쓰겠다.
    url: jdbc:h2:mem:testdb
  h2: # 브라우저로 DB를 직접 볼 수 있게 하겠다.
    console:
      enabled: true
      path: /h2-console
  jpa:
    # 전송 쿼리 확인
    show-sql: true   # 실행되는 SQL을 콘솔에 출력
    properties:
      hibernate:
        format_sql: true  # SQL을 줄바꿈해서 보기 좋게 출력

    # 테이블 생성 후에 data.sql 실행. 이 설정이 없으면 테이블 생성 전 data.sql 실행을 먼저하게 됨
    defer-datasource-initialization: true
